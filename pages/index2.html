<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QrReader</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-slate-950">
    <nav class="w-[100%] fixed bg-slate-950">
        <div class="flex justify-between items-center p-5 ml-3 mr-3 md:ml-10 md:mr-10">
            <div class="flex justify-center items-center">
                <h1 class="text-white text-3xl font-bold">QrReader</h1>
            </div>
            <div class="flex justify-center items-center gap-3">
                <a class="link md:text-xl text-white font-bold border-transparent border-2 hover:border-b-red-400" href="https://rikkudayo1.github.io/QrGen/pages/index.html">Generator</a>
                <a class="link md:text-xl text-white font-bold border-transparent border-2 hover:border-b-red-400" href="">Contact</a>
            </div>
        </div>
    </nav>
    <main class="flex flex-col justify-center items-center mt-20 mb-20">
        <div class="flex flex-col justify-center items-center mt-36 ml-10 mr-10 mb-20">
            <h1 class="font-bold text-4xl md:text-5xl text-red-400">QrReader</h1>
            <h4 class="font-bold text-xl text-white">Free QR Code generator and reader</h4>
        </div>
        <div class="flex flex-col justify-center items-center gap-5">
            <form id="UploadForm" class="flex mb-20">
                <input type="hidden" name="MAX_FILE_SIZE" value="1048576" />
                <input class="bg-white hover:cursor-pointer w-[150px] rounded-l-full p-2 md:w-[300px] lg:w-[500px]" type="file" name="file" id="FileInput">
                <button id="ReadButton" type="button" class="bg-red-400 rounded-r-full p-1 font-bold text-white hover:cursor-pointer">
                    Submit
                </button>
            </form>
            <h1 id="DecodedUrl" class="text-2xl font-bold border-b-2 text-red-400">Decoded Url Here</h1>
        </div>
    </main>
    <footer class="flex bg-gray-900 justify-center items-center">
        <div class="flex flex-col justify-center gap-3 items-center mt-10 mb-10">
            <h1 class="text-white font-bold text-2xl text-center">Made by love, Siraphop Raksaphol</h1>
            <div class="flex gap-3">
                <a class="text-red-400 text-bold text-xl" href="">Discord</a>
                <a class="text-red-400 text-bold text-xl" href="">TikTok</a>
                <a class="text-red-400 text-bold text-xl" href="">Gmail</a>
                <a class="text-red-400 text-bold text-xl" href="">Youtube</a>
            </div>
        </div>
    </footer>

    <script src="../read.js"></script>
</body>
</html>

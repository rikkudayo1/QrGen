<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QrGen</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-slate-950">
    <nav class="w-[100%] fixed bg-slate-950">
        <div class="flex justify-between items-center p-5 ml-3 mr-3 md:ml-10 md:mr-10">
            <div class="flex justify-center items-center">
                <h1 class="text-white text-3xl font-bold">QrGen</h1>
            </div>
            <div class="flex justify-center items-center gap-3">
                <a class="link md:text-xl text-white font-bold border-transparent border-2 hover:border-b-red-400" href="https://rikkudayo1.github.io/QrGen/pages/index2.html">Reader</a>
                <a class="link md:text-xl text-white font-bold border-transparent border-2 hover:border-b-red-400" href="">Contact</a>
                <a class="link md:text-xl text-white font-bold border-transparent border-2 hover:border-b-red-400" href="">More app</a>
            </div>
        </div>
    </nav>
    <main class="flex flex-col justify-center items-center mb-20">
        <div class="flex flex-col justify-center items-center mt-36 ml-10 mr-10 mb-20">
            <h1 class="font-bold text-4xl md:text-5xl text-red-400">Welcome to QrGen</h1>
            <h4 class="font-bold text-xl text-white">Free QR Code generator and reader</h4>
        </div>
        <div class="flex flex-col justify-center items-center gap-5">
            <div class="flex mb-20">
                <input class="bg-white rounded-l-full p-2 w-[350px] md:w-[500px] outline-none" placeholder="Enter URL" type="text" name="" id="TextInput">
                <button id="SubmitButton" class="bg-red-400 rounded-r-full p-1 font-bold text-white hover:cursor-pointer">Confirm</button>
            </div>
            <img id="QRImage" src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=Example" alt="">
            <h1 id="ImageUrl" class="text-white text-2xl font-bold">Example</h1>
        </div>
    </main>
    <footer class="flex bg-gray-900 justify-center items-center">
        <div class="flex flex-col justify-center gap-3 items-center mt-10 mb-10">
            <h1 class="text-white font-bold text-2xl">Made by love, Siraphop Raksaphol</h1>
            <div class="flex gap-3">
                <a class="text-red-400 text-bold text-xl" href="">Discord</a>
                <a class="text-red-400 text-bold text-xl" href="">TikTok</a>
                <a class="text-red-400 text-bold text-xl" href="">Gmail</a>
                <a class="text-red-400 text-bold text-xl" href="">Youtube</a>
            </div>
        </div>
    </footer>

    <script src="../index.js"></script>
</body>
</html>
